# 실행 명령어 : docker-compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml up -d
# 빌드 명령어 : docker-compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# 종료 명령어 : docker-compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml down
# log 명령어 : docker-compose --env-file .env.dev -f docker-compose.yml -f docker-compose.dev.yml logs -f

# 현재 컨테이너 상태 확인 : docker ps
# 특정 컨테이너만 실행, 종료, log 보고 싶다면? : 위 명령에 제일 뒤에 services 이름 넣기 (ex: db, redis, application, ...)

# dev 모니터링 dashboard 주소 : http://localhost:3000
# dev minio dashboard 주소 : http://localhost:9001

services:
  # MySQL 서비스
  db:
    image: mysql:8.0
    container_name: SpringStudy-MySQL
    ports:
      - "${MYSQL_PORT}:3306" # 호스트:컨테이너
    env_file:
      - .env.dev
    environment:
      # .env 파일에서 값을 가져옵니다
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # 헬스체크 추가: 진짜 DB가 준비되었는지 확인
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql # 데이터 영구 저장을 위한 볼륨 연결
    networks:
      - app-network
    restart: always

  # PostgreSQL 서비스
  postgres:
    image: postgres:15-alpine # 버전에 맞게 수정 가능
    container_name: SpringStudy-Postgres
    ports:
      - "${POSTGRES_PORT}:5432" # 호스트:컨테이너
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Seoul
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    restart: always

  # Redis 서비스
  redis:
    image: redis:alpine
    container_name: SpringStudy-Redis
    ports:
      - "${REDIS_PORT}:6379"
    env_file:
      - .env.dev
    # 비밀번호 설정을 위해 커맨드 실행 (비밀번호가 필요 없다면 이 줄 제거)
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # Redis 헬스체크
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: always

  # Spring Boot 서비스
  # 개발 시에는 IntelliJ에서 Spring 서버 띄움

  # ----------------------------
  # 모니터링 시스템 (PLG Stack)
  # ----------------------------

  # 1. Prometheus (메트릭 수집)
  prometheus:
    image: prom/prometheus:latest
    container_name: Prometheus
    volumes:
      - ./monitoring/prometheus-dev.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090"
    networks:
      - app-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  # 2. Loki (로그 저장소)
  loki:
    image: grafana/loki:2.9.0
    container_name: Loki
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    ports:
      - "${LOKI_PORT}:3100"
    # 설정 파일 지정해 실행
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network
    restart: always

  # 3. Promtail (로그 수집 에이전트)
  promtail:
    image: grafana/promtail:2.9.0
    container_name: Promtail
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock # 도커 컨테이너 정보 읽기
      - /var/lib/docker/containers:/var/lib/docker/containers # 컨테이너 로그 파일 읽기
      - ./logs:/var/log/spring-app
      # IntelliJ가 만든 log 파일 컴퓨터에 있어 docker 컨테이너가 볼 수 없음
      # 컴퓨터의 logs 폴더를 컨테이너 내부의 /var/log/spring-app과 연결
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - app-network
    depends_on:
      - loki
    restart: always

  # 4. Grafana (대시보드 UI)
  grafana:
    image: grafana/grafana:latest
    container_name: Grafana
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD} # 초기 비밀번호 설정 (보안상 변경 권장)
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN}
      # WebSocket 연결을 허용할 도메인 명시 (Loki에서 live로 로그 보고 싶을 때)
      - GF_LIVE_ALLOWED_ORIGINS=${GRAFANA_ALLOWED_ORIGINS:-*}
      # [추가] 서브패스를 위한 Grafana 내부 설정 (HTTP)
      - GF_SERVER_ROOT_URL=http://${GRAFANA_DOMAIN}/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./logs:/var/log/spring-app
    networks:
      - app-network
    depends_on:
      - prometheus
      - loki
    restart: always

  minio:
    image: minio/minio:latest
    container_name: minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_API_PORT}:9000" # API Port
      - "${MINIO_CONSOLE_PORT}:9001" # Console Port
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_BROWSER_REDIRECT_URL: ${MINIO_BROWSER_REDIRECT_URL}
    volumes:
      - ./minio_data:/data
    networks:
      - app-network
    restart: always

  # Nginx 설정
  nginx:
    image: nginx:alpine
    container_name: Nginx-Dev
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
    networks:
      - app-network
    depends_on:
      - grafana
      - minio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always