services:
  # MySQL 서비스
  db:
    image: mysql:8.0
    container_name: SpringStudy-MySQL
    ports:
      - "3306:3306" # 호스트:컨테이너
    env_file:
      - .env.dev
    environment:
      # .env 파일에서 값을 가져옵니다
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql # 데이터 영구 저장을 위한 볼륨 연결
    networks:
      - app-network
    restart: always

  # Redis 서비스
  redis:
    image: redis:alpine
    container_name: SpringStudy-Redis
    ports:
      - "6379:6379"
    env_file:
      - .env.dev
    # 비밀번호 설정을 위해 커맨드 실행 (비밀번호가 필요 없다면 이 줄 제거)
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: always

  # Spring Boot 서비스
  # 개발 시에는 IntelliJ에서 Spring 서버 띄움