# HTTP(80) 요청을 HTTPS(443)로 리다이렉트
# server_name 배포 서버의 도메인 이름으로 수정 필요!
server {
    listen 80;
    server_name domain.name;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 메인 웹 서버 (HTTPS 443)
# server_name, ssl_certificate, ssl_certificate_key 배포 서버의 도메인 이름으로 수정 필요!
server {
    listen 443 ssl;
    server_name domain.name;

    ssl_certificate /etc/letsencrypt/live/domain.name/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domain.name/privkey.pem;

    # 제일 기본 경로(/)로 오면 프론트엔드 컨테이너로 전달!
    # 주의: 이 블록은 /api/v1/ 등의 다른 location 블록들보다 위에 있든 아래에 있든 상관없지만,
    # Nginx는 구체적인 경로를 먼저 매칭하므로 안전하게 동작합니다.
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        proxy_pass http://application:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 500s;
        proxy_send_timeout 500s;
        proxy_read_timeout 500s;
        send_timeout 500s;
    }

    # 2. Grafana
    location /grafana/ {
        # 이전에 수정한 대로 끝에 '/' 없음
        proxy_pass http://grafana:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Grafana Live Tailing(웹소켓)을 위한 필수 설정
        # Loki에서 live로 로그 보기 위해서 필수
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /minio/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /minio-admin/ {
        proxy_pass http://minio:9001/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        chunked_transfer_encoding off;
    }
}