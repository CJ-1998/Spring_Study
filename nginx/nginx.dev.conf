server {
    listen 80;
    server_name localhost;

    # 1. Spring Boot API (로컬 PC의 8080 포트로 전달)
    location /api/v1/ {
        proxy_pass http://host.docker.internal:8080/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 500s;
        proxy_send_timeout 500s;
        proxy_read_timeout 500s;
        send_timeout 500s;
    }

    # 2. Grafana
    location /grafana/ {
        # 끝에 '/' 없음
        proxy_pass http://grafana:3000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Grafana Live Tailing(웹소켓)을 위한 필수 설정
        # Loki에서 live로 로그 보기 위해서 필수
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 3. MinIO Storage API (9000 포트) - 끝에 '/' 필수
    location /minio/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. MinIO Console (9001 포트) - 끝에 '/' 필수
    location /minio-admin/ {
        proxy_pass http://minio:9001/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket 필수 설정
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}