version: '3.8'

services:
  # MySQL 서비스
  db:
    image: mysql:8.0
    container_name: SpringStudy-MySQL
    ports:
      - "3307:3306" # 호스트:컨테이너
    environment:
      # .env 파일에서 값을 가져옵니다
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql # 데이터 영구 저장을 위한 볼륨 연결
    networks:
      - app-network
    restart: always

  # Redis 서비스
  redis:
    image: redis:alpine
    container_name: SpringStudy-Redis
    ports:
      - "6379:6379"
    # 비밀번호 설정을 위해 커맨드 실행 (비밀번호가 필요 없다면 이 줄 제거)
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: always

  # Spring Boot 서비스
  application:
    container_name: SpringStudy-Server
    build: .  # 현재 디렉토리에 있는 Dockerfile을 사용하여 빌드
    ports:
      - "8080:8080" # 호스트:컨테이너
    depends_on:
      - db    # db가 실행된 후 실행
      - redis # redis가 실행된 후 실행
    environment:
      # 1. DB 접속 설정 (중요: localhost 대신 서비스명 'db' 사용)
      SPRING_DATASOURCE_URL: ${MYSQL_URL}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      # 2. Redis 접속 설정 (중요: localhost 대신 서비스명 'redis' 사용)
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD} # 레디스 비밀번호 설정 시 필요

      SPRING_PROFILES_ACTIVE: prod # Spring 프로필 지정

    env_file:
      - .env.prod # 개발용 환경변수 파일 로드

    networks:
      - app-network
    restart: always

# 볼륨 정의 (컨테이너를 삭제해도 데이터는 유지됨)
volumes:
  mysql_data:
  redis_data:

# 네트워크 정의 (컨테이너 간 통신)
networks:
  app-network:
    driver: bridge
