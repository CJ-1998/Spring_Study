services:
  # MySQL 서비스
  db:
    image: mysql:8.0
    container_name: SpringStudy-MySQL
    ports:
      - "${MYSQL_PORT}:3306" # 호스트:컨테이너
    env_file:
      - .env.prod
    environment:
      # .env 파일에서 값을 가져옵니다
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    # 헬스체크 추가: 진짜 DB가 준비되었는지 확인
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - mysql_data:/var/lib/mysql # 데이터 영구 저장을 위한 볼륨 연결
    networks:
      - app-network
    restart: always

  # Redis 서비스
  redis:
    image: redis:alpine
    container_name: SpringStudy-Redis
    ports:
      - "${REDIS_PORT}:6379"
    # 비밀번호 설정을 위해 커맨드 실행 (비밀번호가 필요 없다면 이 줄 제거)
    env_file:
      - .env.prod
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # Redis 헬스체크
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data
    networks:
      - app-network
    restart: always

  # Spring Boot 서비스
  application:
    container_name: SpringStudy-Server
    build: .  # 현재 디렉토리에 있는 Dockerfile을 사용하여 빌드
    ports:
      - "${SERVER_PORT}:8080" # 호스트:컨테이너
    depends_on:
      db: # db가 실행된 후 실행
        condition: service_healthy
      redis: # redis가 실행된 후 실행
        condition: service_healthy
    environment:
      # 1. DB 접속 설정 (중요: localhost 대신 서비스명 'db' 사용)
      SPRING_DATASOURCE_URL: ${MYSQL_URL}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      # 2. Redis 접속 설정 (중요: localhost 대신 서비스명 'redis' 사용)
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD} # 레디스 비밀번호 설정 시 필요

      SPRING_PROFILES_ACTIVE: prod # Spring 프로필 지정

    env_file:
      - .env.prod # 운용 환경변수 파일 로드

    networks:
      - app-network
    restart: always

  # ----------------------------
  # 모니터링 시스템 (PLG Stack)
  # ----------------------------

  # 1. Prometheus (메트릭 수집)
  prometheus:
    image: prom/prometheus:latest
    container_name: Prometheus
    volumes:
      - ./monitoring/prometheus-prod.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT}:9090" # EC2 허용 포트 매핑 (외부 접근용)
    networks:
      - app-network
    restart: always

  # 2. Loki (로그 저장소)
  loki:
    image: grafana/loki:2.9.0
    container_name: Loki
    volumes:
      - ./monitoring/loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    ports:
      - "${LOKI_PORT}:3100" # EC2 허용 포트 매핑 (디버깅용, 실제론 내부 통신)
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - app-network
    restart: always

  # 3. Promtail (로그 수집 에이전트)
  promtail:
    image: grafana/promtail:2.9.0
    container_name: Promtail
    volumes:
      - ./monitoring/promtail-config.yaml:/etc/promtail/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock # 도커 컨테이너 정보 읽기
      - /var/lib/docker/containers:/var/lib/docker/containers # 컨테이너 로그 파일 읽기
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - app-network
    depends_on:
      - loki
    restart: always

  # 4. Grafana (대시보드 UI)
  grafana:
    image: grafana/grafana:latest
    container_name: Grafana
    ports:
      - "${GRAFANA_PORT}:3000" # EC2 허용 포트 8001 -> 내부 3000
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD} # 초기 비밀번호 설정 (보안상 변경 권장)
      - GF_SERVER_DOMAIN=${GRAFANA_DOMAIN}
      # WebSocket 연결을 허용할 도메인 명시 (Loki에서 live로 로그 보고 싶을 때)
      - GF_LIVE_ALLOWED_ORIGINS=${GRAFANA_ALLOWED_ORIGINS:-*}
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - app-network
    depends_on:
      - prometheus
      - loki
    restart: always