name: "PR Title Auto Prefix"

on:
  pull_request:
    types: [ opened, edited, synchronize, reopened ]

permissions:
  pull-requests: write

jobs:
  update_pr_title:
    runs-on: ubuntu-latest
    steps:
      - name: Extract Ticket ID and Update Title
        uses: actions/github-script@v6
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref;
            const currentTitle = context.payload.pull_request.title;
            
            // [업그레이드 포인트 1] 대소문자 상관없이 잡기 (a-z 추가)
            // 예: spring-9, SPRING-9 모두 잡음
            const regex = /([a-zA-Z]+-\d+)/;
            const match = branchName.match(regex);
            
            if (match) {
              // [업그레이드 포인트 2] 무조건 대문자로 변환 (SPRING-9)
              const ticketId = match[1].toUpperCase();
            
              // 이미 제목에 [SPRING-9]가 있는지 확인 (중복 방지)
              if (!currentTitle.toUpperCase().includes(ticketId)) {
            
                const newTitle = `[${ticketId}] ${currentTitle}`;
            
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: context.payload.pull_request.number,
                  title: newTitle
                });
            
                console.log(`성공: 제목을 "${newTitle}"로 변경했습니다.`);
              } else {
                console.log("이미 제목에 티켓 번호가 있습니다.");
              }
            } else {
              console.log("브랜치 이름에서 티켓 번호를 찾을 수 없습니다.");
            }