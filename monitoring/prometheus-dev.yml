global:
  scrape_interval: 15s # 15초마다 메트릭 수집

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]

  - job_name: 'spring-boot'
    metrics_path: '/api/v1/actuator/prometheus'
    scrape_interval: 5s
    static_configs:
      # Docker Network 내부이므로 컨테이너 서비스명(application)과 내부 포트(8080) 사용
      - targets: [ 'host.docker.internal:8080' ]
        labels:
          application: 'server'