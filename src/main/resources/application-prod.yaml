spring:
  jpa:
    # DDL 자동 생성 옵션 (가장 중요)
    # validate = 엔티티와 테이블 스키마가 일치하는지 확인만 수행 (불일치 시 시작 불가)
    # 또는 none (아무것도 안 함)
    hibernate:
      ddl-auto: update

    # SQL 로깅 및 방언 설정
    properties:
      hibernate:
        format_sql: false       # 로그에 찍히는 SQL을 보기 좋게 포맷팅
        show_sql: false         # 실행되는 SQL을 콘솔에 출력
        highlight_sql: false    # 예약어들에 하이라이트 되어 출력
        dialect: org.hibernate.dialect.PostgreSQLDialect # PostgreSQL 방언
        # dialect: org.hibernate.dialect.MySQL8Dialect # MySQL 방언

    # SIV 설정 (성능 최적화를 위해 false 권장)
    open-in-view: false

  config:
    import: optional:file:.env.prod[.properties]

logging:
  level:
    # 전체는 INFO로 두어 Spring 부팅 잡다한 로그는 줄임
    root: INFO

    # [중요] 내가 작성 중인 프로젝트 패키지는 DEBUG로 설정
    com.example.project: INFO

    # [JPA] 실행되는 SQL 문장 확인
    org.hibernate.SQL: OFF

    # [JPA] SQL의 ?(물음표)에 바인딩되는 실제 값 확인 (필수)
    org.hibernate.orm.jdbc.bind: OFF