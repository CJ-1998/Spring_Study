spring:
  application:
    name: SpringStudy
  # spring 서버 local에서 IntelliJ로 띄울 때
  # application-dev.yaml 등 읽어오기 위해선 active 필요
  profiles:
    active: dev
    group:
      dev:
        - "dev"
        - "dev-db"
      prod:
        - "prod"
        - "prod-db"
      test:
        - "test"
        - "test-db"

# context path
server:
  servlet:
    context-path: /api/v1

# --- 모니터링 설정 (Actuator) ---
management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

# MinIO 설정
minio:
  endpoint: ${MINIO_ENDPOINT}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket: ${MINIO_BUCKET}

app:
  storage:
    url: ${APP_STORAGE_URL}

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  access-expiration: ${JWT_ACCESS_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}