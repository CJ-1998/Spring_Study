spring:
  jpa:
    # DDL 자동 생성 옵션 (가장 중요)
    hibernate:
      ddl-auto: update

    # SQL 로깅 및 방언 설정
    properties:
      hibernate:
        format_sql: true       # 로그에 찍히는 SQL을 보기 좋게 포맷팅
        show_sql: true         # 실행되는 SQL을 콘솔에 출력
        highlight_sql: true    # 예약어들에 하이라이트 되어 출력
        dialect: org.hibernate.dialect.PostgreSQLDialect # PostgreSQL 방언
        # dialect: org.hibernate.dialect.MySQL8Dialect # MySQL 방언

    # OSIV 설정 (성능 최적화를 위해 false 권장)
    open-in-view: false

  # spring 서버 local에서 IntelliJ로 띄울 때
  # application.yaml에 사용된 .env.dev 값들 읽어오기 위해 필요
  config:
    import: optional:file:.env.dev[.properties]

logging:
  level:
    # 전체는 INFO로 두어 Spring 부팅 잡다한 로그는 줄임
    root: INFO

    # [중요] 내가 작성 중인 프로젝트 패키지는 DEBUG로 설정
    com.example.project: DEBUG

    # [JPA] 실행되는 SQL 문장 확인
    org.hibernate.SQL: DEBUG

    # [JPA] SQL의 ?(물음표)에 바인딩되는 실제 값 확인 (필수)
    org.hibernate.orm.jdbc.bind: TRACE
  
  # 로그들 해당 파일에 작성
  file:
    name: logs/spring.log